[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "software-design-pattern"
version = "0.1.0"
description = "A prescription system demonstrating software design patterns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
